<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="icon" href="/Aaron.webp" />
  <link rel="preload" as="image" href="/Aaron.webp" />
  <script>
    (function () {
      document.documentElement.classList.add("js");
      try {
        var s = localStorage.getItem("theme");
        var t = s || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <!-- SEO: default tags; the prerenderer replaces these per route. -->
  <title>Aaron Thomas | Portfolio</title>
  <meta name="description" content="Aaron Thomas — Full-Stack Developer & AI/RAG Systems Engineer." />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
